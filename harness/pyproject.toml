[project]
name = "optimus-harness"
version = "0.1.0"
description = "Optimus harness: Copilot SDK (BYOK) agent backend for enterprise application support and operations."
requires-python = ">=3.11"
dependencies = [
  "microsoft-copilot-sdk==2.0.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optimus_harness*"]

[tool.setuptools.package-data]
"optimus_harness.tools" = ["catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
